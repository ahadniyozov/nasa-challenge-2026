# Public link to the game without our own server: GitHub Pages.
# Every push to main builds the static web client and publishes it at
#   https://<owner>.github.io/nasa-challenge-2026/
# One-time setup (repo owner): Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; a newer push cancels a waiting one, never a running deploy
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # --mode pages → base '/nasa-challenge-2026/' (apps/web/vite.config.ts)
      - run: npm run build -w @mission/web -- --mode pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
