# Start (from the repo root):   ./deploy/deploy.sh mission.example.com
# or by hand:                   cd deploy && cp .env.example .env && docker compose up -d --build
#
# Only "web" (Caddy + the static game) runs by default. The game needs nothing else.
# The old multiplayer server is optional: docker compose --profile multiplayer up -d --build
services:
  web:
    build: { context: .., dockerfile: deploy/Dockerfile, target: web }
    restart: unless-stopped
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - caddy-data:/data # certificates: keep them, or Let's Encrypt rate limits may hit
      - caddy-config:/config

  # Optional: rooms + leaderboard of the old engineer mode. Not used by the game.
  server:
    profiles: [multiplayer]
    build: { context: .., dockerfile: deploy/Dockerfile, target: server }
    restart: unless-stopped
    volumes: [mission-data:/data]
    mem_limit: 256m

volumes:
  caddy-data:
  caddy-config:
  mission-data:
